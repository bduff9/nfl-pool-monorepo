<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f0f0f" />
    <title>Offline | NFL Confidence Pool</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left));
        background: #0f0f0f;
        color: #fafafa;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 26rem; }
      h1 { margin: 0 0 8px; font-size: 1.75rem; }
      p { margin: 0 0 20px; color: #a3a3a3; line-height: 1.5; }
      .actions { display: flex; flex-direction: column; gap: 10px; }
      a, button {
        display: block;
        padding: 12px 16px;
        border: 1px solid #404040;
        border-radius: 10px;
        background: #1c1c1c;
        color: inherit;
        font: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      button { background: #15803d; border-color: #15803d; font-weight: 600; }
      h2 { margin: 28px 0 10px; font-size: 0.8rem; letter-spacing: 0.08em; text-transform: uppercase; color: #737373; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>This page isn't available without a connection. Making picks needs to be online so your picks are saved.</p>
      <div class="actions">
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
      <h2>Available offline</h2>
      <div class="actions">
        <a href="/">Dashboard</a>
        <a href="/picks/view">My picks</a>
        <a href="/scoreboard">Scoreboard</a>
        <a href="/support">Help</a>
      </div>
    </main>
  </body>
</html>
