packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  # react-doctor (root devDependency) uses @sentry/cli internally.
  '@sentry/cli': true
  # Serwist (@serwist/turbopack) only needs @swc/core's prebuilt platform binary, not its install script.
  '@swc/core': false
  aws-sdk: false
  core-js: false
  esbuild: true
  msw: true
  sharp: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1136.0'
  - '@aws-sdk/client-ses@3.1136.0'
  - '@aws-sdk/lib-storage@3.1136.0'
  - '@types/node@26.6.2'

overrides:
  "@modelcontextprotocol/sdk": "^1.31.0"
  "@types/node": "26.6.5"
  "@types/react": "19.3.0"
  "@types/react-dom": "19.3.0"
  "axios": "1.20.0"
  "braces": "3.0.3"
  "fast-uri": "^3.1.8"
  "form-data": "4.0.6"
  "hono": "^4.13.5"
  "http-cache-semantics": "^4.3.0"
  "js-yaml@<4": "3.15.2"
  "js-yaml@4": "^4.3.2"
  "kysely": "0.29.6"
  "micromatch": "4.0.8"
  "mysql2": "3.24.5"
  "nanoid": "3.3.18"
  "next": "16.4.0"
  "qs": "^6.16.0"
  "react-is": "19.2.6"
  "sharp": "^0.35.5"
  "tar": "7.5.22"
  "trim-newlines": "3.0.1"
  "vite": "8.0.16"
  "yargs-parser": "13.1.2"

strictPeerDependencies: false
