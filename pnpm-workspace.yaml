packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  '@sentry/cli': true
  aws-sdk: false
  esbuild: true
  msw: true
  sharp: true

minimumReleaseAgeExclude:
  - '@aws-sdk/client-s3@3.1136.0'
  - '@aws-sdk/client-ses@3.1136.0'
  - '@aws-sdk/lib-storage@3.1136.0'
  - '@turbo/darwin-64@2.11.2'
  - '@turbo/darwin-arm64@2.11.2'
  - '@turbo/linux-64@2.11.2'
  - '@turbo/linux-arm64@2.11.2'
  - '@turbo/windows-64@2.11.2'
  - '@turbo/windows-arm64@2.11.2'
  - '@types/node@26.6.2'
  - dotenv@18.0.1
  - turbo@2.11.2

overrides:
  "@types/react": "19.2.15"
  "@types/react-dom": "19.2.3"
  "axios": "1.18.0"
  "braces": "3.0.3"
  "fast-uri": "^3.1.6"
  "form-data": "4.0.6"
  "hono": "^4.13.5"
  "js-yaml@<4": "3.15.2"
  "js-yaml@4": "^4.3.2"
  "kysely": "0.29.5"
  "micromatch": "4.0.8"
  "mysql2": "3.24.2"
  "nanoid": "3.3.18"
  "qs": "^6.16.0"
  "react-is": "19.2.6"
  "sharp": "^0.35.4"
  "tar": "7.5.22"
  "trim-newlines": "3.0.1"
  "vite": "8.0.16"
  "yargs-parser": "13.1.2"

strictPeerDependencies: false
